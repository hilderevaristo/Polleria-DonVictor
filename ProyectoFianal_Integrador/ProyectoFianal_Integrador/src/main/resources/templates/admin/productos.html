<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-drumstick-bite"></i>
            <span>DonVictor</span>
            <small>Admin</small>
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/admin/dashboard}"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
            <li class="active"><a th:href="@{/admin/productos}"><i class="fas fa-box"></i> Productos</a></li>
            <li><a th:href="@{/admin/usuarios}"><i class="fas fa-users"></i> Usuarios</a></li>
            <li><a href="#"><i class="fas fa-shopping-cart"></i> Órdenes</a></li>
            <li><a href="#"><i class="fas fa-cog"></i> Configuración</a></li>
        </ul>
        <div class="sidebar-footer">
            <a th:href="@{/logout}" class="btn btn-logout">
                <i class="fas fa-sign-out-alt"></i> Cerrar sesión
            </a>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="top-header">
            <div class="d-flex justify-content-between align-items-center">
                <h4><i class="fas fa-box text-primary"></i> Productos</h4>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-muted small">Bienvenido, <strong th:text="${adminNombre}">Admin</strong></span>
                    <a th:href="@{/}" class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> Volver al sitio
                    </a>
                </div>
            </div>
            <p class="text-muted small">Lista de productos registrados en el sistema</p>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h5 class="text-center">📦 Sección de Productos</h5>
                <p class="text-center text-muted">Aquí puedes gestionar los productos del catálogo</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
