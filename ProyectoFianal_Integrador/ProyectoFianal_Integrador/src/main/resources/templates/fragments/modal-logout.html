<div th:fragment="modal-logout" class="modal fade" id="modalCerrarSesion" tabindex="-1" aria-labelledby="modalCerrarSesionLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content"
                style="background-color: #ffffff !important; border-radius: 12px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">

                <div class="modal-header" style="border-bottom: none; padding-top: 20px; padding-bottom: 0;">
                    <h5 class="modal-title fw-bold" id="modalCerrarSesionLabel" style="color: #dc3545;">
                        <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body text-center" style="padding: 25px 30px;">
                    <p style="font-size: 1.15rem; color: #444444; margin-bottom: 0;">
                        ¿Estás seguro de que deseas salir de tu cuenta?
                    </p>
                </div>

                <div class="modal-footer"
                    style="border-top: none; display: flex; justify-content: center; padding-bottom: 30px;">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"
                        style="padding: 10px 30px; margin-right: 15px; font-weight: 500;">
                        Cancelar
                    </button>
                    <a th:href="@{/logout}" class="btn btn-danger" style="padding: 10px 30px; font-weight: bold;">
                        Sí, salir
                    </a>
                </div>

            </div>
        </div>
    </div>
