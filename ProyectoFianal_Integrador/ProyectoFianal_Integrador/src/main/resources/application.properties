
spring.application.name=ProyectoFianal_Integrador
spring.datasource.url=jdbc:mysql://localhost:3306/bd_integrador
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

# 1. MITIGACIÓN CWE-1295 / CWE-550: Apagar trazas de error técnicos en el navegador
server.error.include-stacktrace=never
server.error.include-message=never

# 2. MITIGACIÓN CWE-598 (jsessionid en URL): Forzar uso estricto de cookies para la sesión
server.servlet.session.tracking-modes=cookie

# 3. MITIGACIÓN CWE-1275: Configurar la Cookie de sesión con SameSite restrictivo y HttpOnly
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# 1. MONITOREO DE LOGS: Definición de niveles y ruta física
logging.level.root=INFO
logging.level.com.example.ProyectoFianal_Integrador=DEBUG
logging.file.name=logs/polleria_donvictor.log

# Configuración de Rotación de Logs (Buena práctica de retención segura)
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# 2. MONITOREO DE RENDIMIENTO Y SALUD: Exposición de endpoints de Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always